name: Cleanup Influencers

# 인플루언서 테이블 정리 — 옛 블렌드 OS 잔여 데이터 삭제 + shop_managed 표시 도입
# 보존: 로그인 계정 연결(user_id) 또는 쇼핑몰 귀속 주문이 있는 계정 → shop_managed=true
# 삭제: 그 외 전부 (apply=false 드라이런 기본 — 대상 수/마스킹 이름만 출력)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true 입력 시 실제 삭제 (기본 드라이런)"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            APPLY="${{ github.event.inputs.apply }}" node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const os = new Pool({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            const APPLY = process.env.APPLY === "true";
            const mask = (s) => { s = String(s || ""); return s.length <= 1 ? s : s.length === 2 ? s[0] + "*" : s[0] + "*".repeat(s.length - 2) + s[s.length - 1]; };
            (async () => {
              // ① shop_managed 컬럼 도입 (없으면 추가)
              await os.query("ALTER TABLE influencers ADD COLUMN IF NOT EXISTS shop_managed boolean NOT NULL DEFAULT false");
              // ② 보존 대상 표시 — 로그인 계정 연결 또는 쇼핑몰 귀속 주문 보유
              const withOrders = (await shop.query(
                "SELECT DISTINCT influencer_id FROM orders WHERE influencer_id IS NOT NULL")).rows.map(r => r.influencer_id);
              const marked = await os.query(
                `UPDATE influencers SET shop_managed = true
                 WHERE user_id IS NOT NULL OR id::text = ANY($1) RETURNING name`, [withOrders]);
              console.log("보존(shop_managed=true):", marked.rows.length, "명 →", marked.rows.map(r => mask(r.name)).join(", "));
              // ③ 삭제 대상 = 표시 안 된 전부
              const targets = (await os.query(
                "SELECT id, name, to_char(created_at, \x27YYYY-MM-DD\x27) AS created FROM influencers WHERE shop_managed = false ORDER BY created_at")).rows;
              console.log("삭제 대상:", targets.length, "명");
              for (const t of targets) console.log("  -", mask(t.name), "(등록", t.created + ")");
              if (!APPLY) { console.log("\n[드라이런] apply=true 로 다시 실행하면 위 대상이 삭제됩니다."); }
              else {
                // 옛 캠페인 등 다른 테이블이 참조(FK)하는 행은 지울 수 없음 → 건너뜀
                // (건너뛴 행도 shop_managed=false 라 쇼핑몰 화면에는 안 나타남)
                let deleted = 0; const skipped = [];
                for (const t of targets) {
                  try { const r = await os.query("DELETE FROM influencers WHERE id = $1 AND shop_managed = false", [t.id]); deleted += r.rowCount; }
                  catch (e) { skipped.push(mask(t.name) + " (" + String(e.message).slice(0, 60) + ")"); }
                }
                console.log("\n✅ 삭제 완료:", deleted, "건 / 참조로 건너뜀:", skipped.length, "건");
                for (const s of skipped.slice(0, 20)) console.log("  건너뜀:", s);
                if (skipped.length > 20) console.log("  ... 외", skipped.length - 20, "건");
                const remain = await os.query("SELECT COUNT(*) AS n FROM influencers");
                console.log("남은 인플루언서:", remain.rows[0].n, "명 (화면 표시:", marked.rows.length, "명)");
              }
              await os.end(); await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
