name: Refund Missed Cancellations

# 취소 처리는 됐지만 토스 환불이 누락된 주문을 전액 환불 — 주문번호를 명시해서만 실행.
# 안전장치: ① status=cancelled 인 주문만 ② 토스 잔액(balanceAmount)이 남은 건만 환불
# ③ apply=false면 대상 확인만(dry-run). 로그엔 주문번호·금액만 (개인정보 없음)
on:
  workflow_dispatch:
    inputs:
      order_numbers:
        description: "쉼표로 구분한 주문번호"
        required: true
        default: "BP-20260727-575C21,BP-20260727-5E2AF2,BP-20260727-5A171F"
      apply:
        description: "true면 실제 환불 (기본은 dry-run)"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Refund on EC2
        uses: appleboy/ssh-action@v1
        env:
          ORDER_NUMBERS: ${{ github.event.inputs.order_numbers }}
          APPLY: ${{ github.event.inputs.apply }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ORDER_NUMBERS,APPLY
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            const auth = "Basic " + Buffer.from(process.env.TOSS_SECRET_KEY + ":").toString("base64");
            const nums = (process.env.ORDER_NUMBERS || "").split(",").map((s) => s.trim()).filter(Boolean);
            const apply = process.env.APPLY === "true";
            (async () => {
              const r = await shop.query(`
                SELECT order_number, payment_key, total_amount FROM orders
                 WHERE order_number = ANY($1) AND status = \x27cancelled\x27
                   AND payment_key IS NOT NULL AND payment_key NOT LIKE \x27SIM_%\x27`, [nums]);
              const found = new Set(r.rows.map((o) => o.order_number));
              for (const n of nums) if (!found.has(n)) console.log(` ! ${n} — 취소 상태의 실결제 주문이 아님 (건너뜀)`);
              let refunded = 0, skipped = 0, failed = 0;
              for (const o of r.rows) {
                const q = await fetch("https://api.tosspayments.com/v1/payments/" + o.payment_key, { headers: { Authorization: auth } });
                const p = q.ok ? await q.json() : null;
                const bal = Number(p?.balanceAmount ?? 0);
                if (bal <= 0) { skipped++; console.log(` - ${o.order_number} — 이미 환불 완료 (잔액 0원)`); continue; }
                if (!apply) { console.log(` ○ ${o.order_number} — 환불 대상 ${bal.toLocaleString()}원`); continue; }
                const c = await fetch("https://api.tosspayments.com/v1/payments/" + o.payment_key + "/cancel", {
                  method: "POST",
                  headers: { Authorization: auth, "Content-Type": "application/json" },
                  body: JSON.stringify({ cancelReason: "취소 주문 환불 누락 보정" }),
                });
                if (c.ok) { refunded++; console.log(` ✓ ${o.order_number} — ${bal.toLocaleString()}원 환불 완료`); }
                else {
                  const e = await c.json().catch(() => ({}));
                  failed++; console.log(` ✗ ${o.order_number} — 환불 실패: ${e.message || c.status}`);
                }
              }
              console.log(apply
                ? `결과: 환불 ${refunded}건 / 이미 완료 ${skipped}건 / 실패 ${failed}건`
                : "dry-run — apply=true로 다시 실행하면 위 대상을 전액 환불합니다");
              await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
