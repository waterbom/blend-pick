name: Migrate Hotel Delivery

# 호텔 전달 상태 관리용 스키마 — 멱등(IF NOT EXISTS).
# · orders.hotel_sent_at / hotel_confirmed_at: 호텔 전달·확인 도장
# · hotel_stay_changes: 예약 변경 이력 (변경 전→후, 처리 관리자, 시각)
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              await shop.query("ALTER TABLE orders ADD COLUMN IF NOT EXISTS hotel_sent_at timestamptz");
              await shop.query("ALTER TABLE orders ADD COLUMN IF NOT EXISTS hotel_confirmed_at timestamptz");
              await shop.query(`CREATE TABLE IF NOT EXISTS hotel_stay_changes (
                id SERIAL PRIMARY KEY,
                order_id uuid NOT NULL,
                prev_check_in date, prev_check_out date,
                new_check_in date,  new_check_out date,
                prev_label text, new_label text,
                changed_by text,
                changed_at timestamptz NOT NULL DEFAULT NOW()
              )`);
              await shop.query("CREATE INDEX IF NOT EXISTS idx_hotel_stay_changes_order ON hotel_stay_changes(order_id)");
              const c = await shop.query(`SELECT
                (SELECT COUNT(*)::int FROM information_schema.columns WHERE table_name = \x27orders\x27 AND column_name IN (\x27hotel_sent_at\x27, \x27hotel_confirmed_at\x27)) AS cols,
                (SELECT COUNT(*)::int FROM information_schema.tables WHERE table_name = \x27hotel_stay_changes\x27) AS tbl`);
              const ok = c.rows[0].cols === 2 && c.rows[0].tbl === 1;
              console.log(ok ? "✅ 호텔 전달 스키마 준비 완료" : "✗ 스키마 확인 실패");
              await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
