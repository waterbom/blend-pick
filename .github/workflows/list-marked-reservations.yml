name: List Marked Reservations

# 변경(날짜 변경 이력) / 취소 후 재결제 예약번호 목록 조회 (읽기 전용, 일회성)
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Query on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            const mask = (s) => { s = String(s || ""); return s.length <= 1 ? s : s.length === 2 ? s[0] + "*" : s[0] + "*".repeat(s.length - 2) + s[s.length - 1]; };
            (async () => {
              const r = await shop.query(`
                SELECT o.order_number, o.buyer_name, o.status,
                       o.stay_changed_at IS NOT NULL AS changed,
                       (o.status <> \x27cancelled\x27 AND EXISTS (
                         SELECT 1 FROM orders c
                          WHERE c.order_type = \x27hotel\x27 AND c.status = \x27cancelled\x27
                            AND c.buyer_phone = o.buyer_phone
                            AND c.id <> o.id AND c.created_at < o.created_at
                       )) AS repaid
                  FROM orders o
                 WHERE o.order_type = \x27hotel\x27
                   AND (o.stay_changed_at IS NOT NULL OR (o.status <> \x27cancelled\x27 AND EXISTS (
                         SELECT 1 FROM orders c
                          WHERE c.order_type = \x27hotel\x27 AND c.status = \x27cancelled\x27
                            AND c.buyer_phone = o.buyer_phone
                            AND c.id <> o.id AND c.created_at < o.created_at)))
                 ORDER BY o.created_at`);
              for (const o of r.rows) {
                const marks = [o.changed ? "변경" : null, o.repaid ? "재결제" : null].filter(Boolean).join("·");
                console.log(o.order_number, mask(o.buyer_name), o.status, marks);
              }
              console.log("총", r.rows.length, "건");
              await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
