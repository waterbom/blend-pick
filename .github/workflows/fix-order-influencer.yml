name: Fix Order Influencer

# 주문 귀속 인플루언서 정정 (드라이런 기본)
# 드라이런: 구매자 성씨로 호텔 주문 목록 + 쇼핑몰 인플루언서 목록(id 앞자리) 출력
# 적용: order_number + influencer_prefix 지정 시 해당 주문 귀속 변경
on:
  workflow_dispatch:
    inputs:
      buyer:
        description: "구매자 이름 (조회용)"
        required: true
      order_number:
        description: "정정할 주문번호 (적용 시)"
        required: false
        default: ""
      influencer_prefix:
        description: "새 인플루언서 id 앞 8자리 (적용 시)"
        required: false
        default: ""
      apply:
        description: "true 입력 시 실제 적용"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Fix on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            BUYER="${{ github.event.inputs.buyer }}" ORDER_NO="${{ github.event.inputs.order_number }}" INF_PREFIX="${{ github.event.inputs.influencer_prefix }}" APPLY="${{ github.event.inputs.apply }}" node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const os = new Pool({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            const { BUYER, ORDER_NO, INF_PREFIX } = process.env;
            const APPLY = process.env.APPLY === "true";
            const mask = (s) => { s = String(s || ""); return s.length <= 1 ? s : s.length === 2 ? s[0] + "*" : s[0] + "*".repeat(s.length - 2) + s[s.length - 1]; };
            (async () => {
              const orders = (await shop.query(
                `SELECT order_number, buyer_name, status, influencer_name,
                        to_char(stay_check_in, \x27MM-DD\x27) AS ci, total_amount,
                        to_char(created_at AT TIME ZONE \x27Asia/Seoul\x27, \x27MM-DD HH24:MI\x27) AS at
                 FROM orders WHERE order_type = \x27hotel\x27 AND buyer_name = $1 ORDER BY created_at`, [BUYER])).rows;
              console.log("주문 (" + mask(BUYER) + "):", orders.length, "건");
              for (const o of orders) console.log(" ", o.order_number, "|", o.status, "| 체크인", o.ci, "|", Number(o.total_amount).toLocaleString() + "원", "| 귀속:", o.influencer_name ? mask(o.influencer_name) : "(없음)", "| 결제", o.at);
              const infs = (await os.query(
                "SELECT id, name FROM influencers WHERE shop_managed = true ORDER BY name")).rows;
              console.log("\n쇼핑몰 인플루언서:");
              for (const i of infs) console.log("  id=" + i.id.slice(0, 8), mask(i.name));
              if (!APPLY || !ORDER_NO || !INF_PREFIX) { console.log("\n[드라이런] order_number·influencer_prefix·apply=true 로 적용"); await os.end(); await shop.end(); return; }
              const inf = infs.find((i) => i.id.startsWith(INF_PREFIX));
              if (!inf) { console.log("!! 인플루언서 못 찾음:", INF_PREFIX); process.exit(1); }
              const r = await shop.query(
                "UPDATE orders SET influencer_id = $1, influencer_name = $2 WHERE order_number = $3 AND order_type = \x27hotel\x27 RETURNING order_number",
                [inf.id, inf.name, ORDER_NO]);
              if (!r.rows.length) { console.log("!! 주문 못 찾음:", ORDER_NO); process.exit(1); }
              console.log("\n✅ 정정 완료:", ORDER_NO, "→", mask(inf.name));
              await os.end(); await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
