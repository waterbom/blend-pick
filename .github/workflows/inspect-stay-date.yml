name: Inspect Stay Date

# 특정 투숙일의 객실 판매 현황 조회 (읽기전용)
# ① 재고표(hotel_room_inventory) 수치 ② 결제 주문 기준 실제 점유 수 — 둘을 교차 확인
on:
  workflow_dispatch:
    inputs:
      date:
        description: "투숙일 (YYYY-MM-DD)"
        required: true
        default: "2026-07-27"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            STAY_DATE="${{ github.event.inputs.date }}" node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            const D = process.env.STAY_DATE;
            (async () => {
              // ① 재고표 수치
              const inv = await shop.query(
                `SELECT room_type, allocated, booked, allocated - booked AS remaining
                 FROM hotel_room_inventory WHERE stay_date = $1 ORDER BY room_type`, [D]);
              console.log("===INVENTORY=== (" + D + ")");
              for (const r of inv.rows)
                console.log(`${r.room_type} | 배정 ${r.allocated} | 판매 ${r.booked} | 잔여 ${r.remaining}`);
              if (inv.rows.length === 0) console.log("(재고표 없음)");
              // ② 결제 주문 기준 — 해당 날짜 밤을 점유하는 paid 예약 (체크인 <= D < 체크아웃)
              const ord = await shop.query(
                `SELECT COALESCE(split_part((SELECT product_name FROM order_items WHERE order_id = o.id LIMIT 1), \x27 · \x27, 3), \x27?\x27) AS room,
                        COUNT(*) AS n
                 FROM orders o
                 WHERE o.order_type = \x27hotel\x27 AND o.status = \x27paid\x27
                   AND o.stay_check_in <= $1 AND o.stay_check_out > $1
                 GROUP BY 1 ORDER BY 1`, [D]);
              console.log("===PAID_ORDERS_OCCUPYING=== (" + D + " 밤 점유, 예약확정만)");
              let total = 0;
              for (const r of ord.rows) { console.log(`${r.room} | ${r.n}건`); total += Number(r.n); }
              console.log("합계: " + total + "건");
              await shop.end();
            })();'
