name: Server Cleanup (one-off)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove pm2 duplication and unused local PostgreSQL
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            echo "===== A. pm2 정리 (systemd로 일원화) ====="
            pm2 delete blend-pick 2>&1 || true
            pm2 save --force 2>&1 || true
            sudo systemctl disable --now pm2-ubuntu 2>&1 || true
            pm2 kill 2>&1 || true
            echo "===== B. 로컬 PostgreSQL 서버 제거 (RDS만 사용) ====="
            sudo systemctl disable --now postgresql 2>&1 || true
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get purge -y postgresql postgresql-18 postgresql-client postgresql-client-18 postgresql-16 2>&1 | tail -5 || true
            sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get autoremove -y 2>&1 | tail -3 || true
            echo "===== C. 검증 ====="
            echo "--- blend-pick.service ---"
            systemctl is-enabled blend-pick && systemctl is-active blend-pick
            echo "--- port 3000 ---"
            sudo ss -tlnp | grep ':3000' || echo "NOT LISTENING!"
            echo "--- HTTP check ---"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:3000 || true
            echo "--- pm2 (없어야 정상) ---"
            pm2 list 2>&1 || echo "pm2 daemon not running (OK)"
            echo "--- 남은 postgres 패키지 (client-17만 있으면 정상) ---"
            dpkg -l | grep -E '^ii.*postgres' || true
            echo "--- pg_dump 17 동작 확인 ---"
            /usr/lib/postgresql/17/bin/pg_dump --version
