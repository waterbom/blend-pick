name: Recover Lost Extra Order

# 토스 승인 후 저장 실패로 유실된 차액 주문 1건 복구 (일회성)
# 대상: BP-H-20260714-D18281 예약 변경 차액 350,000원 (2026-07-16 13:57:06 KST 승인)
# 같은 품명의 extra 주문이 이미 있으면 중단 (중복 방지)
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true면 복구 실행 (기본은 조회만)"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Recover on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            APPLY="${{ github.event.inputs.apply }}" node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            const RES = "BP-H-20260714-D18281";
            const LABEL = RES + " 예약 변경 차액";
            const AMOUNT = 350000;
            const PAID_AT = "2026-07-16T04:57:06Z"; // 13:57:06 KST
            (async () => {
              // ① 원 예약에서 구매자 정보 확보
              const src = await shop.query(
                "SELECT buyer_name, buyer_phone FROM orders WHERE order_number = $1 AND order_type = \x27hotel\x27", [RES]);
              if (src.rows.length !== 1) { console.log("중단: 원 예약을 찾지 못함"); process.exit(1); }
              const { buyer_name, buyer_phone } = src.rows[0];
              console.log("원 예약 확인: " + RES + " / 구매자 " + buyer_name[0] + "**");
              // ② 중복 확인 — 같은 품명의 extra 주문이 이미 있으면 중단
              const dup = await shop.query(
                `SELECT e.order_number FROM orders e JOIN order_items ei ON ei.order_id = e.id
                 WHERE e.order_type = \x27extra\x27 AND ei.product_name = $1`, [LABEL]);
              if (dup.rows.length > 0) { console.log("중단: 이미 복구됨 (" + dup.rows[0].order_number + ")"); process.exit(0); }
              console.log("중복 없음 — 복구 대상 확인");
              if (process.env.APPLY !== "true") { console.log("===DRY_RUN=== apply=true로 재실행 시 복구 삽입"); await shop.end(); return; }
              // ③ 복구 삽입 (extra-confirm과 동일 형태, paid_at은 토스 승인 시각)
              const orderNumber = "BP-E-20260716-" + crypto.randomBytes(3).toString("hex").toUpperCase();
              const c = await shop.connect();
              try {
                await c.query("BEGIN");
                const { rows } = await c.query(
                  `INSERT INTO orders (
                    order_number, buyer_name, buyer_phone, recipient_name, recipient_phone,
                    addr_memo, total_amount, shipping_fee, status, payment_key, payment_method, paid_at, order_type
                  ) VALUES ($1,$2,$3,$4,$5,$6,$7,0,\x27paid\x27,NULL,\x27카드\x27,$8,\x27extra\x27) RETURNING id`,
                  [orderNumber, buyer_name, buyer_phone, buyer_name, buyer_phone, LABEL + " (저장 실패 복구)", AMOUNT, PAID_AT]);
                await c.query(
                  `INSERT INTO order_items (order_id, product_id, product_name, option_label, unit_price, quantity)
                   VALUES ($1, NULL, $2, \x27\x27, $3, 1)`, [rows[0].id, LABEL, AMOUNT]);
                await c.query("COMMIT");
                console.log("===RECOVERED=== " + orderNumber + " / " + AMOUNT.toLocaleString() + "원 / paid_at " + PAID_AT);
              } catch (e) { await c.query("ROLLBACK"); console.log("복구 실패: " + e.message); process.exit(1); }
              finally { c.release(); }
              await shop.end();
            })();'
