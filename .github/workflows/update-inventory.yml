name: Update Hotel Inventory

# 호텔에서 받은 잔여객실표(0715)로 재고 전면 업데이트 (일회성 실행용)
# 의미: 각 날짜·객실의 "판매 가능 잔여"를 표의 수치로 맞춤 → allocated = booked + 잔여
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update inventory on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const DATA = "2026-07-15:5/5;2026-07-16:1/10;2026-07-17:0/0;2026-07-18:3/10;2026-07-19:5/15;2026-07-20:5/10;2026-07-21:3/15;2026-07-22:3/10;2026-07-23:5/3;2026-07-24:5/10;2026-07-25:5/10;2026-07-26:5/10;2026-07-27:3/3;2026-07-28:3/3;2026-07-29:5/5;2026-07-30:3/0;2026-07-31:1/1;2026-08-01:1/1;2026-08-02:1/1;2026-08-03:5/5;2026-08-04:5/10;2026-08-05:5/10;2026-08-06:3/10;2026-08-07:0/10;2026-08-08:5/10;2026-08-09:5/10;2026-08-10:5/10;2026-08-11:5/10;2026-08-12:5/10;2026-08-13:3/10;2026-08-14:3/10;2026-08-15:3/3;2026-08-16:3/5;2026-08-17:3/10;2026-08-18:3/10;2026-08-19:0/10;2026-08-20:3/10;2026-08-21:5/10;2026-08-22:5/10;2026-08-23:5/10;2026-08-24:5/10;2026-08-25:5/10;2026-08-26:5/10;2026-08-27:5/10;2026-08-28:3/10;2026-08-29:3/10;2026-08-30:3/10;2026-08-31:5/10;2026-09-01:5/10;2026-09-02:5/10;2026-09-03:5/10;2026-09-04:5/10;2026-09-05:5/10;2026-09-06:5/10;2026-09-07:5/10;2026-09-08:5/10;2026-09-09:5/3;2026-09-10:5/10;2026-09-11:5/10;2026-09-12:5/10;2026-09-13:5/10;2026-09-14:5/10;2026-09-15:5/10;2026-09-16:5/10;2026-09-17:5/10;2026-09-18:5/10;2026-09-19:5/10;2026-09-20:5/10;2026-09-21:5/10;2026-09-22:5/10;2026-09-23:5/10;2026-09-24:5/10;2026-09-25:5/10;2026-09-26:5/10;2026-09-27:5/10;2026-09-28:5/10;2026-09-29:5/10;2026-09-30:5/10;2026-10-01:5/10;2026-10-02:5/10;2026-10-03:5/10;2026-10-04:5/10;2026-10-05:5/10;2026-10-06:5/10;2026-10-07:5/10;2026-10-08:5/10;2026-10-09:5/10;2026-10-10:5/10;2026-10-11:5/10;2026-10-12:5/10;2026-10-13:5/10;2026-10-14:5/10;2026-10-15:5/10;2026-10-16:5/10;2026-10-17:5/10;2026-10-18:5/10;2026-10-19:5/10;2026-10-20:5/10;2026-10-21:5/10;2026-10-22:5/10;2026-10-23:5/10;2026-10-24:5/10;2026-10-25:5/10;2026-10-26:5/10;2026-10-27:5/10;2026-10-28:5/0;2026-10-29:5/0;2026-10-30:5/10;2026-10-31:5/10";
            const ROOMS = { double: "디럭스 더블", twin: "패밀리 트윈" };
            const { Pool } = require("pg");
            const pool = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              const client = await pool.connect();
              try {
                await client.query("BEGIN");
                let updated = 0, inserted = 0;
                for (const entry of DATA.split(";")) {
                  const [date, nums] = entry.split(":");
                  const [dbl, twn] = nums.split("/").map(Number);
                  for (const [key, roomType] of Object.entries(ROOMS)) {
                    const remaining = key === "double" ? dbl : twn;
                    const u = await client.query(
                      "UPDATE hotel_room_inventory SET allocated = booked + $1 WHERE stay_date = $2 AND room_type = $3",
                      [remaining, date, roomType]);
                    if (u.rowCount === 1) updated++;
                    else {
                      await client.query(
                        "INSERT INTO hotel_room_inventory (stay_date, room_type, allocated, booked) VALUES ($1, $2, $3, 0)",
                        [date, roomType, remaining]);
                      inserted++;
                    }
                  }
                }
                await client.query("COMMIT");
                console.log(`UPDATED=${updated} INSERTED=${inserted}`);
                const chk = await client.query(`
                  SELECT room_type, SUM(allocated - booked)::int AS remaining,
                         COUNT(*) FILTER (WHERE allocated - booked <= 0)::int AS closed_days
                  FROM hotel_room_inventory
                  WHERE stay_date BETWEEN \x272026-07-15\x27 AND \x272026-10-31\x27
                  GROUP BY room_type ORDER BY room_type`);
                console.log("===AFTER===");
                for (const r of chk.rows) console.log(`${r.room_type}: remaining=${r.remaining}, closed_days=${r.closed_days}`);
                const outside = await client.query(
                  "SELECT COUNT(*)::int AS n FROM hotel_room_inventory WHERE stay_date NOT BETWEEN \x272026-07-15\x27 AND \x272026-10-31\x27");
                console.log(`rows_outside_sheet_range=${outside.rows[0].n} (미변경)`);
              } catch (e) {
                await client.query("ROLLBACK");
                console.error("FAILED, rolled back:", e.message);
                process.exit(1);
              } finally {
                client.release();
                await pool.end();
              }
            })();'
