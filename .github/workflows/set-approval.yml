name: Set Approval Mode

# 특정 투숙일·객실을 승인제(예약대기)로 켜거나 끄기
# 승인제인 날짜가 포함된 예약은 결제 후 '예약대기'로 저장 → 관리자 승인 시 확정
on:
  workflow_dispatch:
    inputs:
      date:
        description: "투숙일 (YYYY-MM-DD, 전체 = 승인제 걸린 모든 날짜 — 끄기 전용)"
        required: true
      room:
        description: "객실 (패밀리 트윈 / 디럭스 더블 / 전체)"
        required: false
        default: "패밀리 트윈"
      mode:
        description: "on = 승인제 켜기 / off = 끄기"
        required: false
        default: "on"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Set on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            D="${{ github.event.inputs.date }}" R="${{ github.event.inputs.room }}" M="${{ github.event.inputs.mode }}" node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const pool = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              const on = process.env.M === "on";
              // date=전체: 승인제 걸린 모든 날짜 일괄 해제 (실수 방지를 위해 끄기 전용)
              if (process.env.D === "전체") {
                if (on) { console.log("중단: 전체는 끄기(off) 전용입니다"); process.exit(1); }
                const u = await pool.query(
                  `UPDATE hotel_room_inventory SET needs_approval = false WHERE needs_approval
                   RETURNING stay_date::text, room_type, allocated, booked`);
                if (u.rows.length === 0) { console.log("승인제 걸린 날짜 없음 — 해제할 것 없음"); await pool.end(); return; }
                for (const r of u.rows)
                  console.log(`===OFF=== ${r.stay_date} | ${r.room_type} (배정 ${r.allocated}, 판매 ${r.booked})`);
                console.log("총", u.rows.length, "건 해제");
                await pool.end(); return;
              }
              const roomCond = process.env.R === "전체" ? "" : " AND room_type = $3";
              const params = [on, process.env.D];
              if (process.env.R !== "전체") params.push(process.env.R);
              const u = await pool.query(
                `UPDATE hotel_room_inventory SET needs_approval = $1 WHERE stay_date = $2${roomCond}
                 RETURNING room_type, allocated, booked, needs_approval`, params);
              if (u.rows.length === 0) { console.log("중단: 해당 날짜/객실 재고 행 없음"); process.exit(1); }
              for (const r of u.rows)
                console.log(`===SET=== ${process.env.D} | ${r.room_type} | 승인제 ${r.needs_approval ? "ON" : "OFF"} (배정 ${r.allocated}, 판매 ${r.booked})`);
              await pool.end();
            })();'
