name: Migrate Stay Changed Flag

# orders.stay_changed_at 컬럼 추가 + 기변경 3건 백필 (일회성)
# 이미연·박유진(투숙일 재할당), 안혜림(재결제 정정) — 명단 엑셀 "변경" 표시용
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              await shop.query("ALTER TABLE orders ADD COLUMN IF NOT EXISTS stay_changed_at timestamptz");
              const r = await shop.query(
                `UPDATE orders SET stay_changed_at = NOW()
                 WHERE order_number = ANY($1) AND stay_changed_at IS NULL
                 RETURNING order_number`,
                [["BP-H-20260716-06D574", "BP-H-20260717-D1EACF", "BP-H-20260721-83A1B1"]]);
              console.log("✅ 컬럼 추가 + 백필:", r.rows.map(x => x.order_number).join(", ") || "(이미 표시됨)");
              await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
