name: Export Daily Sales

on:
  workflow_dispatch:
    inputs:
      date:
        description: "조회 날짜 (YYYY-MM-DD, KST). 비우면 어제"
        required: false
        default: ""

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Query sales on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            TARGET_DATE="${{ github.event.inputs.date }}" node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const pool = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              const dateExpr = process.env.TARGET_DATE
                ? "$1::date"
                : "((CURRENT_TIMESTAMP AT TIME ZONE \x27Asia/Seoul\x27)::date - 1)";
              const params = process.env.TARGET_DATE ? [process.env.TARGET_DATE] : [];
              const { rows } = await pool.query(`
                SELECT o.order_number,
                       to_char(o.paid_at AT TIME ZONE \x27Asia/Seoul\x27, \x27HH24:MI\x27) AS t,
                       o.order_type, o.buyer_name, o.status,
                       o.total_amount, o.shipping_fee,
                       COALESCE(o.influencer_name, \x27\x27) AS influencer_name,
                       COALESCE((SELECT product_name FROM order_items WHERE order_id = o.id LIMIT 1), \x27\x27) AS item,
                       COALESCE((SELECT option_label FROM order_items WHERE order_id = o.id LIMIT 1), \x27\x27) AS opt
                FROM orders o
                WHERE o.paid_at IS NOT NULL
                  AND (o.paid_at AT TIME ZONE \x27Asia/Seoul\x27)::date = ${dateExpr}
                ORDER BY o.paid_at ASC`, params);
              // 공개 저장소 로그 — 구매자 이름은 마스킹해서 출력
              const mask = (n) => !n ? "" : n.length <= 1 ? n : n[0] + "*".repeat(Math.max(1, n.length - 2)) + (n.length > 2 ? n[n.length - 1] : "");
              console.log("===CSV_START===");
              console.log("order_number|time|type|buyer|status|total|shipping|influencer|item|opt");
              for (const r of rows)
                console.log([r.order_number, r.t, r.order_type, mask(r.buyer_name), r.status, r.total_amount, r.shipping_fee, r.influencer_name, r.item, r.opt].join("|"));
              console.log("===CSV_END===");
              await pool.end();
            })();'
