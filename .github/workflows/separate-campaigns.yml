name: Separate Campaigns

# 공구(campaigns) 테이블에 shop_managed 표시 도입 — 옛 블렌드 OS 공구와 분리
# 보존 표시: 쇼핑몰 관리 인플루언서의 공구, 또는 쇼핑몰 주문/기타비용이 참조하는 공구
# 삭제 없음 — 표시만 하고 쇼핑몰 화면은 표시된 공구만 보여줌
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const os = new Pool({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              await os.query("ALTER TABLE campaigns ADD COLUMN IF NOT EXISTS shop_managed boolean NOT NULL DEFAULT false");
              const refs = new Set();
              for (const r of (await shop.query("SELECT DISTINCT campaign_id FROM orders WHERE campaign_id IS NOT NULL")).rows) refs.add(r.campaign_id);
              for (const r of (await shop.query("SELECT DISTINCT campaign_id FROM campaign_costs")).rows) refs.add(r.campaign_id);
              const marked = await os.query(
                `UPDATE campaigns SET shop_managed = true
                 WHERE influencer_id IN (SELECT id FROM influencers WHERE shop_managed = true)
                    OR id::text = ANY($1)
                 RETURNING id`, [[...refs]]);
              const total = await os.query("SELECT COUNT(*) AS n FROM campaigns");
              console.log("전체 공구:", total.rows[0].n, "건");
              console.log("쇼핑몰 표시(shop_managed=true):", marked.rows.length, "건");
              console.log("숨김 처리(옛 OS 공구):", Number(total.rows[0].n) - marked.rows.length, "건");
              await os.end(); await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
