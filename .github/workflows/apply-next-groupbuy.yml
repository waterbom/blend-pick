# ① 하블리네 공구 즉시 종료  ② 도도네 공구 7/22 10:00 ~ 7/26 23:59 KST 설정
# ③ 0720 객실표로 재고 전면 교체 — 표 숫자 = 지금부터 판매 가능 수 (allocated = booked + 표값, 마감=booked)
