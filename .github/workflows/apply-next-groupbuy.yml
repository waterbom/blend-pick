              console.log("표 항목:", SHEET.length, "| 변경:", changes, "| 신규:", inserts, "| 마감 처리:", soldout);
              for (const p of preview) console.log("  ", p);
              if (!APPLY) { console.log("\n[드라이런] apply=true 로 실제 적용"); await os.end(); await shop.end(); return; }
              // 적용
              await os.query("UPDATE influencers SET hotel_sale_deadline = NOW() WHERE id::text LIKE \x27223519b5%\x27 AND hotel_sale_deadline > NOW()");
              await os.query("UPDATE influencers SET hotel_sale_start = \x272026-07-22T10:00:00+09:00\x27, hotel_sale_deadline = \x272026-07-26T23:59:00+09:00\x27 WHERE id::text LIKE \x2717121b0d%\x27");
              const client = await shop.connect();
              try {
                await client.query("BEGIN");
                for (const [d, room, open] of SHEET) {
                  const r = await client.query(
                    "UPDATE hotel_room_inventory SET allocated = booked + $3 WHERE stay_date = $1 AND room_type = $2", [d, room, open]);
                  if (r.rowCount === 0) await client.query(
                    "INSERT INTO hotel_room_inventory (stay_date, room_type, allocated, booked) VALUES ($1, $2, $3, 0)", [d, room, open]);
                }
                await client.query("COMMIT");
              } catch (e) { await client.query("ROLLBACK"); throw e; } finally { client.release(); }
              const after = await shop.query(
                "SELECT to_char(stay_date, \x27MM-DD\x27) AS d, room_type, allocated - booked AS remain FROM hotel_room_inventory WHERE stay_date BETWEEN \x272026-07-21\x27 AND \x272026-07-27\x27 ORDER BY stay_date, room_type");
              console.log("\n✅ 적용 완료 — 7/21~27 잔여 확인:");
              for (const r of after.rows) console.log("  ", r.d, r.room_type, "잔여", r.remain);
              const iv = await os.query("SELECT name, to_char(hotel_sale_start AT TIME ZONE \x27Asia/Seoul\x27, \x27MM-DD HH24:MI\x27) AS s, to_char(hotel_sale_deadline AT TIME ZONE \x27Asia/Seoul\x27, \x27MM-DD HH24:MI\x27) AS e FROM influencers WHERE shop_managed = true ORDER BY name");
              for (const r of iv.rows) console.log("일정:", r.name[0] + "*", r.s, "~", r.e);
              await os.end(); await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
