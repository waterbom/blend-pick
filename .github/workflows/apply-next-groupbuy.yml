            (async () => {
              // ① 하블리네 종료 (진행 중일 때만)
              const havli = await os.query(
                "SELECT name, to_char(hotel_sale_deadline AT TIME ZONE \x27Asia/Seoul\x27, \x27MM-DD HH24:MI\x27) AS dl FROM influencers WHERE id::text LIKE \x27223519b5%\x27");
              console.log("하블리네 현재 마감:", havli.rows[0] && havli.rows[0].dl);
              // ② 도도네 일정
              const dodo = await os.query(
                "SELECT name FROM influencers WHERE id::text LIKE \x2717121b0d%\x27");
              console.log("도도네 확인:", dodo.rows.length ? "OK" : "!! 없음");
              // ③ 재고 diff 계산
              const inv = await shop.query("SELECT stay_date::text AS d, room_type, allocated, booked FROM hotel_room_inventory");
              const invMap = new Map(inv.rows.map(r => [r.d + "|" + r.room_type, r]));
              let changes = 0, inserts = 0, soldout = 0;
              const preview = [];
              for (const [d, room, open] of SHEET) {
                const cur = invMap.get(d + "|" + room);
                const booked = cur ? Number(cur.booked) : 0;
                const target = booked + open;
                if (open === 0) soldout++;
                if (!cur) { inserts++; preview.push(d + " " + room + ": 신규 잔여 " + open); }
                else if (Number(cur.allocated) !== target) { changes++; if (preview.length < 30) preview.push(d + " " + room + ": 배정 " + cur.allocated + "→" + target + " (판매 " + booked + ", 잔여 " + (Number(cur.allocated) - booked) + "→" + open + ")"); }
