name: Security dependency update

on:
  push:
    branches: [security-hardening-20261022]
    paths:
      - .github/workflows/security-dependency-update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-hardening-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install patched framework versions
        run: npm install --save-exact next@16.4.2 react@19.2.9 react-dom@19.2.9 eslint-config-next@16.4.2
      - name: Record dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes"
          else
            git commit -m "fix(security): patch Next.js and React vulnerabilities"
            git push origin HEAD:security-hardening-20261022
          fi
