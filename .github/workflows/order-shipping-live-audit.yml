name: Read-only order shipping audit 20261030
on:
  push:
    branches: [audit/order-shipping-20261030]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate production order flow without changing records
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -eu
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node <<'NODE'
            require('@next/env').loadEnvConfig(process.cwd(),false);
            const {Pool}=require('pg');
            if(!process.env.SHOP_DATABASE_URL)throw Error('Shop database not configured');
            const pool = new Pool({connectionString:process.env.SHOP_DATABASE_URL,ssl:{rejectUnauthorized:false},connectionTimeoutMillis:5000,statement_timeout:25000});
            const queries={"last24h":"SELECT site,status,COUNT(*)::int AS n FROM orders WHERE created_at>=NOW()-INTERVAL '24 hours' AND order_type IN ('shop','campaign') GROUP BY site,status ORDER BY site,status","last7d":"SELECT site,status,COUNT(*)::int AS n FROM orders WHERE created_at>=NOW()-INTERVAL '7 days' AND order_type IN ('shop','campaign') GROUP BY site,status ORDER BY site,status","issues":"SELECT site, COUNT(*) FILTER (WHERE status IN ('paid','confirmed') AND created_at < NOW()-INTERVAL '24 hours')::int AS waiting_confirmation_over_24h, COUNT(*) FILTER (WHERE status='preparing' AND updated_at < NOW()-INTERVAL '48 hours')::int AS preparing_over_48h, COUNT(*) FILTER (WHERE status='shipped' AND shipped_at < NOW()-INTERVAL '7 days')::int AS shipping_over_7d, COUNT(*) FILTER (WHERE status='shipped' AND (NULLIF(TRIM(tracking_number),'') IS NULL OR NULLIF(TRIM(tracking_company),'') IS NULL))::int AS shipped_missing_invoice, COUNT(*) FILTER (WHERE status='delivered' AND (NULLIF(TRIM(tracking_number),'') IS NULL OR NULLIF(TRIM(tracking_company),'') IS NULL))::int AS delivered_missing_invoice, COUNT(*) FILTER (WHERE status IN ('confirmed','preparing','shipped','delivered') AND (paid_at IS NULL OR NULLIF(payment_key,'') IS NULL OR payment_key LIKE 'SIM_%'))::int AS fulfillment_without_valid_payment, COUNT(*) FILTER (WHERE status='cancelled' AND cancelled_at IS NOT NULL AND shipped_at > cancelled_at)::int AS shipment_after_cancellation, COUNT(*) FILTER (WHERE status IN ('preparing','shipped') AND EXISTS (SELECT 1 FROM refund_operations r WHERE r.order_id=orders.id AND r.status NOT IN ('completed','rejected')))::int AS active_shipping_pending_refund, COUNT(*) FILTER (WHERE status='delivered' AND NOT EXISTS (SELECT 1 FROM settlements s WHERE s.order_id=orders.id))::int AS delivered_missing_settlement, COUNT(*) FILTER (WHERE status='delivered' AND delivered_at IS NULL)::int AS delivered_without_timestamp FROM orders WHERE order_type IN ('shop','campaign') AND created_at >= NOW()-INTERVAL '30 days' GROUP BY site ORDER BY site","outbox":"SELECT site,status,COUNT(*)::int AS n FROM shipment_notifications GROUP BY site,status ORDER BY site,status","oldOutbox":"SELECT site,COUNT(*)::int AS n FROM shipment_notifications WHERE status IN ('pending','retry','sending') AND created_at<NOW()-INTERVAL '24 hours' GROUP BY site ORDER BY site","refundQueue":"SELECT o.site,r.status,COUNT(*)::int AS n FROM refund_operations r JOIN orders o ON o.id=r.order_id WHERE r.status NOT IN ('completed','rejected') AND r.updated_at<NOW()-INTERVAL '30 minutes' GROUP BY o.site,r.status ORDER BY o.site,r.status","duplicateSettlement":"SELECT o.site,COUNT(*)::int AS n FROM (SELECT order_id FROM settlements GROUP BY order_id HAVING COUNT(*)>1) d JOIN orders o ON o.id=d.order_id GROUP BY o.site ORDER BY o.site"};
            async function audit(){
              const c=await pool.connect();
              try {
                await c.query('BEGIN TRANSACTION READ ONLY');
                console.log('AUDIT_READ_ONLY_AT_KST='+new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}));
                for(const [name,sql] of Object.entries(queries)){
                  const r=await c.query(sql);
                  console.log('AUDIT_'+name+'='+JSON.stringify(r.rows));
                }
                await c.query('COMMIT');
                console.log('AUDIT_COMPLETED_READ_ONLY=true');
              } catch(e){try{await c.query('ROLLBACK')}catch{};throw e}
              finally {c.release();}
            }
            audit().catch(e=>{console.error('AUDIT_FAILED='+String(e?.message||e).slice(0,200));process.exitCode=1}).finally(()=>pool.end());
            NODE
