name: Connect Naver DataLab
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/naver-connect.yml'
      - 'scripts/naver/connect.cjs'
      - 'tests/naver-connection.cjs'
permissions:
  contents: read
concurrency:
  group: deploy-to-ec2
  cancel-in-progress: false
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Isolated credential and response checks
        run: node --test tests/naver-connection.cjs
      - name: Verify and store credentials on EC2
        uses: appleboy/ssh-action@v1
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: NAVER_CLIENT_ID,NAVER_CLIENT_SECRET
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            git pull --ff-only origin main
            node scripts/naver/connect.cjs
            sudo systemctl restart blend-pick
            sudo systemctl is-active --quiet blend-pick
            echo "Naver configuration applied; service active."
