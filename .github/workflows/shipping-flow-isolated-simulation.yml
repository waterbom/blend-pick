name: Shipping flow isolated simulation
on:
  push:
    branches: [audit/order-shipping-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test tests/shipping-production-audit.cjs
      - run: npm run test:admin-integrity
      - run: npm run test:tracking-import
      - run: npm run test:shipping
      - run: npm run test:process-edges
      - run: npm run build
        env:
          CI_DB_FREE_BUILD: 'true'
