name: Audit Broken Tracking Numbers

# 엑셀 지수 표기(E+)로 망가진 운송장번호 주문 점검 (읽기 전용, 주문번호만 출력)
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Audit on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              const r = await shop.query(`
                SELECT order_number, tracking_number
                  FROM orders
                 WHERE tracking_number ~ \x27[eE][+]\x27
                 ORDER BY order_number`);
              console.log(`지수 표기로 망가진 운송장 주문: ${r.rows.length}건`);
              for (const row of r.rows) console.log(` - ${row.order_number} (${row.tracking_number})`);
              console.log("→ 원본 운송장 엑셀(셀 서식 텍스트)로 같은 주문번호를 다시 업로드하면 번호만 갱신됩니다 (문자 재발송 없음)");
              await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
