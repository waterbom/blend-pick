name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-to-ec2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            git pull --ff-only origin main
            npm ci
            npm run test:admin-integrity
            npm run test:admin-charts
            npm run test:admin-workflow
            npm run test:shipping
            npm run test:buyer
            npm run test:process-edges
            npm run test:images
            npm run test:commerce-automation
            node --test tests/payment-launch.cjs
            node scripts/check-admin-auth.cjs
            node scripts/check-payment-config.cjs
            # 스키마 마이그레이션 (idempotent) — 코드가 새 컬럼을 쓰기 전에 먼저 반영
            node scripts/migrate-order-site.cjs || { echo "::error::orders.site 마이그레이션 실패 — 배포 중단"; exit 1; }
            node scripts/prepare-commerce-automation.cjs
            node scripts/prepare-buyer-convenience.cjs
            node scripts/check-shipping-config.cjs
            node scripts/prepare-visit-analytics.cjs
            npm run build
            sudo systemctl restart blend-pick
            sudo systemctl is-active --quiet blend-pick
            echo "Deployment service is active."
            node scripts/check-upload-serving.cjs
            sudo "$(command -v node)" scripts/install-traffic-monitor.cjs

      - name: Verify both storefront Google ownership tags
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from urllib.request import Request, urlopen
          expected = "dllj-7POmcmD4QjM-5mXHEdKYpLCFE4O_Fbi_wRvWJY"
          class Tags(HTMLParser):
              in_head = False
              verified = False
              def handle_starttag(self, tag, attrs):
                  if tag == "head": self.in_head = True
                  values = dict(attrs)
                  if self.in_head and tag == "meta" and values.get("name") == "google-site-verification" and values.get("content") == expected:
                      self.verified = True
              def handle_endtag(self, tag):
                  if tag == "head": self.in_head = False
          for host in ("sanjipick.blendpunch.com", "shop.blendpunch.com"):
              request = Request("https://" + host + "/", headers={"User-Agent": "Googlebot"})
              with urlopen(request, timeout=30) as response:
                  parser = Tags()
                  parser.feed(response.read().decode("utf-8"))
                  assert response.status == 200 and parser.verified, "Google verification tag missing from " + host
              print("PASS: Google verification tag is present in the live HTML head: " + host)
          PY
