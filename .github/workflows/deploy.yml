name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check key format (temporary debug)
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "lines: $(printf '%s' "$KEY" | wc -l)"
          echo "chars: $(printf '%s' "$KEY" | wc -c)"
          echo "starts with BEGIN: $(printf '%s' "$KEY" | head -1 | grep -c 'BEGIN' || true)"
          echo "ends with END: $(printf '%s' "$KEY" | tail -1 | grep -c 'END' || true)"
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            git pull
            npm ci
            npm run build
            pm2 restart blend-pick
