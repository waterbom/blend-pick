name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check key format (temporary debug)
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$KEY" > /tmp/k
          chmod 600 /tmp/k
          echo "--- header bytes ---"
          head -1 /tmp/k | od -c | head -4
          echo "--- footer bytes ---"
          tail -1 /tmp/k | od -c | head -4
          echo "--- carriage returns: $(grep -c $'\r' /tmp/k || true) ---"
          if ssh-keygen -y -f /tmp/k > /dev/null 2>&1; then
            echo "RESULT: KEY IS VALID"
          else
            echo "RESULT: KEY IS INVALID"
          fi
          rm -f /tmp/k
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            git pull
            npm ci
            npm run build
            pm2 restart blend-pick
