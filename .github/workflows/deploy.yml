name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets (temporary debug)
        env:
          KEY: ${{ secrets.EC2_SSH_KEY }}
          H: ${{ secrets.EC2_HOST }}
          U: ${{ secrets.EC2_USER }}
        run: |
          printf '%s\n' "$KEY" > /tmp/k
          chmod 600 /tmp/k
          echo "derived public key from secret: $(ssh-keygen -y -f /tmp/k 2>/dev/null || echo FAILED)"
          echo "expected public key on server : ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK1wbj524paka0oCdyngxq81mYkCDu0jI8OmJk/ENu2s"
          if [ "$H" = "3.34.51.70" ]; then echo "HOST: matches 3.34.51.70"; else echo "HOST: DIFFERENT from 3.34.51.70 (length ${#H})"; fi
          if [ "$U" = "ubuntu" ]; then echo "USER: matches ubuntu"; else echo "USER: DIFFERENT from ubuntu (length ${#U})"; fi
          rm -f /tmp/k
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            git pull
            npm ci
            npm run build
            pm2 restart blend-pick
