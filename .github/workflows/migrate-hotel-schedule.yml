name: Migrate Hotel Schedule Columns

# influencers 테이블에 호텔 공구 일정 컬럼 추가 + 기존 인플루언서 일정 백필 (일회성)
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Run migration on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const pool = new Pool({ connectionString: process.env.DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              await pool.query("ALTER TABLE influencers ADD COLUMN IF NOT EXISTS hotel_sale_start timestamptz");
              await pool.query("ALTER TABLE influencers ADD COLUMN IF NOT EXISTS hotel_sale_deadline timestamptz");
              console.log("columns OK");
              // 진행 중/예정 인플루언서 일정 백필 (이미 값이 있으면 건드리지 않음)
              const r1 = await pool.query(`
                UPDATE influencers SET hotel_sale_start = \x272026-07-14 20:00:00+09\x27, hotel_sale_deadline = \x272026-07-17 23:59:59+09\x27
                 WHERE name = \x27아이랑 여행 민경\x27 AND hotel_sale_start IS NULL`);
              const r2 = await pool.query(`
                UPDATE influencers SET hotel_sale_start = \x272026-07-16 10:00:00+09\x27, hotel_sale_deadline = \x272026-07-21 23:59:59+09\x27
                 WHERE name = \x27하블리네\x27 AND hotel_sale_start IS NULL`);
              console.log(`backfill: 민경=${r1.rowCount}건, 하블리네=${r2.rowCount}건`);
              const chk = await pool.query(`
                SELECT name,
                       to_char(hotel_sale_start AT TIME ZONE \x27Asia/Seoul\x27, \x27MM-DD HH24:MI\x27) AS s,
                       to_char(hotel_sale_deadline AT TIME ZONE \x27Asia/Seoul\x27, \x27MM-DD HH24:MI\x27) AS d
                  FROM influencers WHERE hotel_sale_start IS NOT NULL ORDER BY name`);
              console.log("===SCHEDULES===");
              for (const r of chk.rows) console.log(`${r.name}: ${r.s} ~ ${r.d}`);
              await pool.end();
            })();'
