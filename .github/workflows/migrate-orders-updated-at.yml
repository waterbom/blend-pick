name: Migrate Orders updated_at

# orders.updated_at 컬럼 추가 — 취소 경로가 참조하는데 상용에 없어서
# 일반 주문 셀프취소가 500으로 실패하던 문제의 근본 수정. 멱등(IF NOT EXISTS).
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              await shop.query("ALTER TABLE orders ADD COLUMN IF NOT EXISTS updated_at timestamptz");
              const c = await shop.query(`SELECT COUNT(*)::int AS n FROM information_schema.columns
                WHERE table_name = \x27orders\x27 AND column_name = \x27updated_at\x27`);
              console.log(c.rows[0].n === 1 ? "✅ orders.updated_at 준비 완료" : "✗ 컬럼 확인 실패");
              await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
