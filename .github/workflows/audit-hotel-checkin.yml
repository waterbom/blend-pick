name: Audit Hotel Checkin Conflicts

# 취소 흔적이 있는데 체크인완료로 표시되는 호텔 예약 점검 (읽기 전용, 예약번호만 출력)
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Audit on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              // 체크인완료·노쇼인데 취소 시각이 찍혀 있는 모순 데이터
              const a = await shop.query(`
                SELECT order_number, status, to_char(cancelled_at AT TIME ZONE \x27Asia/Seoul\x27, \x27MM/DD HH24:MI\x27) AS cancelled_kst
                  FROM orders
                 WHERE order_type = \x27hotel\x27 AND status IN (\x27checked_in\x27, \x27no_show\x27)
                   AND cancelled_at IS NOT NULL
                 ORDER BY order_number`);
              console.log(`체크인완료/노쇼인데 취소 기록 있는 예약: ${a.rows.length}건`);
              for (const r of a.rows) console.log(` - ${r.order_number} (${r.status}, 취소기록 ${r.cancelled_kst})`);
              // 참고: 상태별 현황
              const s = await shop.query(`
                SELECT status, COUNT(*)::int AS n FROM orders WHERE order_type = \x27hotel\x27 GROUP BY status ORDER BY status`);
              console.log("호텔 예약 상태별 현황:");
              for (const r of s.rows) console.log(` - ${r.status}: ${r.n}건`);
              await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
