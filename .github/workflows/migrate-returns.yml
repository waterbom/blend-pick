name: Migrate Returns

# 교환·반품 신청 테이블 — order_returns(신청 상세) + order_return_events(처리 이력). 멱등(IF NOT EXISTS).
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              await shop.query(`CREATE TABLE IF NOT EXISTS order_returns (
                id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
                order_id uuid NOT NULL REFERENCES orders(id),
                kind text NOT NULL CHECK (kind IN (\x27exchange\x27, \x27return\x27)),
                status text NOT NULL DEFAULT \x27requested\x27,
                items jsonb NOT NULL DEFAULT \x27[]\x27,
                reason text NOT NULL,
                detail text,
                photos jsonb NOT NULL DEFAULT \x27[]\x27,
                pickup_address text,
                pickup_detail text,
                fee_agreed boolean NOT NULL DEFAULT false,
                prev_status text,
                created_at timestamptz NOT NULL DEFAULT NOW()
              )`);
              await shop.query("CREATE INDEX IF NOT EXISTS idx_order_returns_order ON order_returns(order_id)");
              await shop.query(`CREATE TABLE IF NOT EXISTS order_return_events (
                id serial PRIMARY KEY,
                return_id uuid NOT NULL REFERENCES order_returns(id),
                status text NOT NULL,
                note text,
                admin_name text,
                created_at timestamptz NOT NULL DEFAULT NOW()
              )`);
              const c = await shop.query(`SELECT COUNT(*)::int AS n FROM information_schema.tables
                WHERE table_name IN (\x27order_returns\x27, \x27order_return_events\x27)`);
              console.log(c.rows[0].n === 2 ? "✅ 교환·반품 스키마 준비 완료" : "✗ 테이블 확인 실패");
              await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
