name: Admin integrity checks
on:
  pull_request:
  push:
    branches: [main, security-hardening-20261022]
permissions:
  contents: write
jobs:
  isolated-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:visits
      - run: npm run test:admin-integrity
      - run: npm run test:admin-charts
      - run: npm run test:product-sales
      - run: npm run test:admin-workflow
      - run: npm run test:shipping
      - run: npm run test:process-edges
      - run: npm run test:images
      - run: npm run test:account
      - run: npm run test:buyer
      - run: node tests/sanjipick-mypage.cjs
      - run: node --test tests/product-seo.cjs
      - run: node --test tests/ci-db-free-build.cjs
      - run: npm run build
        env:
          # No DB service/secrets in this job; defer catalog queries to runtime.
          CI_DB_FREE_BUILD: 'true'


  security-dependency-refresh:
    if: github.ref == 'refs/heads/security-hardening-20261022'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-hardening-20261022
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --save-exact next@16.4.2 react@19.2.9 react-dom@19.2.9 eslint-config-next@16.4.2
      - name: Commit patched lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "fix(security): patch Next.js and React vulnerabilities"
          git push origin HEAD:security-hardening-20261022
