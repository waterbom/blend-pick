name: Schema Check (one-off)

on:
  workflow_dispatch:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - name: Dump campaigns table schema
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_APP_DIR }}
            PSQL="/usr/lib/postgresql/17/bin/psql"
            OS_URL="$(grep '^DATABASE_URL=' .env.local | cut -d= -f2-)"
            echo "===== campaigns schema ====="
            PGSSLMODE=require $PSQL "$OS_URL" -c "\d campaigns" 2>&1
            echo "===== sample campaign id format ====="
            PGSSLMODE=require $PSQL "$OS_URL" -c "SELECT LENGTH(id) AS id_len, COUNT(*) FROM campaigns GROUP BY 1 LIMIT 3" 2>&1
