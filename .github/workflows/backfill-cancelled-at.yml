name: Backfill Cancelled At

# orders.cancelled_at 컬럼 추가 + 과거 취소건의 취소 시각을 토스 결제조회로 복구 (일회성)
# apply=false 면 조회만 하고 DB는 컬럼 추가 외에 변경하지 않음
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true 면 실제로 cancelled_at 업데이트"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Backfill on EC2
        uses: appleboy/ssh-action@v1
        env:
          APPLY: ${{ github.event.inputs.apply }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APPLY
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const shop = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            const apply = process.env.APPLY === "true";
            const auth = "Basic " + Buffer.from(process.env.TOSS_SECRET_KEY + ":").toString("base64");
            (async () => {
              await shop.query("ALTER TABLE orders ADD COLUMN IF NOT EXISTS cancelled_at timestamptz");
              const rows = (await shop.query(`
                SELECT id, order_number, payment_key FROM orders
                 WHERE status = \x27cancelled\x27 AND cancelled_at IS NULL
                   AND payment_key IS NOT NULL AND payment_key NOT LIKE \x27SIM_%\x27
                 ORDER BY created_at`)).rows;
              let done = 0, miss = 0;
              for (const o of rows) {
                const res = await fetch("https://api.tosspayments.com/v1/payments/" + o.payment_key, {
                  headers: { Authorization: auth } });
                if (!res.ok) { miss++; console.log("  조회실패:", o.order_number, res.status); continue; }
                const p = await res.json();
                const cancels = Array.isArray(p.cancels) ? p.cancels : [];
                if (!cancels.length) { miss++; console.log("  취소기록없음:", o.order_number, p.status); continue; }
                // 여러 건(부분환불 포함)이면 마지막 취소 트랜잭션 시각 = 최종 취소 시점
                const at = cancels.map(c => c.canceledAt).sort().pop();
                if (apply) await shop.query("UPDATE orders SET cancelled_at = $1 WHERE id = $2", [at, o.id]);
                done++;
                console.log(" ", o.order_number, "→", at, apply ? "(반영)" : "(dry-run)");
              }
              console.log(apply ? "✅ 반영" : "🔍 dry-run", done, "건 / 실패·기록없음", miss, "건 / 대상", rows.length, "건");
              await shop.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
