name: Migrate Reviews (order link)

# 리뷰 ↔ 주문 연결 컬럼 추가 — 배송완료 구매자 검증·주문당 1회 제한에 사용 (멱등, 재실행 안전)
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const pool = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              await pool.query("ALTER TABLE reviews ADD COLUMN IF NOT EXISTS order_id uuid");
              await pool.query(`CREATE UNIQUE INDEX IF NOT EXISTS reviews_order_product_uniq
                                ON reviews (order_id, product_id) WHERE order_id IS NOT NULL`);
              console.log("reviews.order_id + 유니크 인덱스 OK");
              await pool.end();
            })().catch(e => { console.error(e.message); process.exit(1); });
            '
