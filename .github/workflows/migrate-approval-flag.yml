name: Migrate Approval Flag

# hotel_room_inventory에 승인제 플래그 컬럼 추가 (예약대기 기능용, 일회성)
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Run migration on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_DIR }}
            node -e '
            const fs = require("fs");
            for (const line of fs.readFileSync(".env.local", "utf8").split("\n")) {
              const m = line.match(/^\s*([A-Z_]+)\s*=\s*(.*)\s*$/);
              if (m && !process.env[m[1]]) process.env[m[1]] = m[2].replace(/^["\x27]|["\x27]$/g, "");
            }
            const { Pool } = require("pg");
            const pool = new Pool({ connectionString: process.env.SHOP_DATABASE_URL, ssl: { rejectUnauthorized: false } });
            (async () => {
              await pool.query("ALTER TABLE hotel_room_inventory ADD COLUMN IF NOT EXISTS needs_approval boolean NOT NULL DEFAULT false");
              console.log("needs_approval column OK");
              await pool.end();
            })();'
